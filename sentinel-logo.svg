<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel security logo</title>
  <desc id="desc">A neon cyan and green shield with an eye, surrounded by a dark cyberpunk grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b12"/><stop offset="1" stop-color="#071b1c"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00eeff"/><stop offset=".5" stop-color="#00ff88"/><stop offset="1" stop-color="#f7931a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00eeff" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="480" rx="20" fill="url(#grid)"/>
  <g opacity=".35" stroke="#00ff88" fill="none"><path d="M60 410H300M900 110h240M80 130h170M970 410h160"/><circle cx="80" cy="410" r="5" fill="#00ff88"/><circle cx="1120" cy="110" r="5" fill="#00eeff"/></g>
  <g filter="url(#glow)">
    <path d="M300 86 480 42l180 44v125c0 122-72 207-180 260-108-53-180-138-180-260Z" fill="#071416" stroke="url(#shield)" stroke-width="10"/>
    <path d="M345 184c45-62 135-62 180 0-45 62-135 62-180 0Z" fill="none" stroke="#00eeff" stroke-width="8"/>
    <circle cx="435" cy="184" r="25" fill="#00ff88" stroke="#071416" stroke-width="8"/>
    <circle cx="435" cy="184" r="8" fill="#050b12"/>
    <path d="M375 300h120M395 330h80" stroke="#f7931a" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g font-family="monospace" fill="#e8ffff"><text x="720" y="210" font-size="76" font-weight="700" letter-spacing="12">SENTINEL</text><text x="725" y="265" font-size="22" fill="#00ff88" letter-spacing="6">OPEN SECURITY // COMMUNITY BUILT</text><text x="725" y="325" font-size="18" fill="#8aa6ad">GHOST • VIPER • CIPHER</text></g>
</svg>
